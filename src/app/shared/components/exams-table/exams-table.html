<!-- Table Container (Horizontal Scroll on Small Screens) -->
<section class="w-full overflow-x-auto">
    <table class="w-full border-collapse">
        <!-- Table Header -->
        <thead>
            <tr class="bg-gray-50/50 border-b border-gray-100">
                <th class="px-6 py-4 text-right text-gray-400 font-medium text-xs font-['Cairo'] whitespace-nowrap">اسم
                    الاختبار</th>
                <th class="px-6 py-4 text-right text-gray-400 font-medium text-xs font-['Cairo'] whitespace-nowrap">
                    النوع</th>
                <th class="px-6 py-4 text-right text-gray-400 font-medium text-xs font-['Cairo'] whitespace-nowrap">
                    الموعد</th>
                <th class="px-6 py-4 text-right text-gray-400 font-medium text-xs font-['Cairo'] whitespace-nowrap">
                    المسجلين</th>
                <th class="px-6 py-4 text-right text-gray-400 font-medium text-xs font-['Cairo'] whitespace-nowrap">قيد
                    المراجعة</th>
                <th class="px-6 py-4 text-right text-gray-400 font-medium text-xs font-['Cairo'] whitespace-nowrap">
                    السعر</th>
                <th class="px-6 py-4 text-right text-gray-400 font-medium text-xs font-['Cairo'] whitespace-nowrap">
                    الحالة</th>
                <th class="px-6 py-4 text-center text-gray-400 font-medium text-xs font-['Cairo'] whitespace-nowrap">
                    إجراءات</th>
            </tr>
        </thead>
        <!-- Table Body -->
        <tbody class="divide-y divide-gray-50">
            @for (exam of exams; track exam.id) {
            <tr class="hover:bg-gray-50/30 transition-colors">
                <!-- Exam Name -->
                <td class="px-6 py-5 font-['Cairo'] text-sm text-gray-900 whitespace-nowrap">
                    {{ exam.name }}
                </td>
                <!-- Type (Badge) -->
                <td class="px-6 py-5 whitespace-nowrap">
                    <span
                        class="px-3 py-1 bg-[#EFF6FF] text-[#3B82F6] font-semibold text-[10px] rounded-lg font-['Cairo'] uppercase">
                        {{ exam.exam_type.name }}
                    </span>
                </td>
                <!-- Date & Time -->
                <td class="px-6 py-5 whitespace-nowrap">
                    <div class="flex items-center gap-2 text-gray-600 font-['Cairo'] text-sm">
                        <span>{{ exam.exam_date }}</span>
                        <span class="text-xs text-gray-400">{{ exam.exam_time }}</span>
                        <img [ngSrc]="'images/icons/calendar.png'" alt="Time" class="w-4 h-4 object-contain opacity-40"
                            width="16" height="16">
                    </div>
                </td>
                <!-- Enrolled (Progress) -->
                <td class="px-6 py-5 whitespace-nowrap">
                    <button type="button" (click)="onViewEnrollments(exam)"
                        class="group flex items-center gap-3 rounded-lg px-2 py-1 -mx-2 transition-colors hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#155DFC]/30"
                        aria-label="عرض المسجلين في هذا الاختبار">
                        <span
                            class="inline-flex items-center gap-2 px-2.5 py-1 rounded-md bg-[#EFF6FF] text-[#155DFC] font-['Cairo'] text-xs font-semibold">
                            <img [ngSrc]="'images/icons/eye.svg'" alt="" class="w-3.5 h-3.5 object-contain opacity-80"
                                width="14" height="14">
                            {{ exam.enrolled_students || 0 }}/{{ exam.max_students }}
                            <span class="text-[10px] text-gray-500 font-normal group-hover:text-[#155DFC]">عرض</span>
                        </span>
                        <div class="w-16 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-[#155DFC]" [style.width]="getProgressWidth(exam)"></div>
                        </div>
                    </button>
                </td>
                <!-- Reviewing (Count with Icon) - Hidden from API -->
                <td class="px-6 py-5 whitespace-nowrap">
                    <span class="text-gray-300 font-['Cairo'] text-sm">-</span>
                </td>
                <!-- Price -->
                <td class="px-6 py-5 font-['Cairo'] text-sm text-gray-900 font-medium whitespace-nowrap">
                    {{ exam.price.value | number }} ج.م
                </td>
                <!-- Status -->
                <td class="px-6 py-5 whitespace-nowrap">
                    <span
                        [class]="'px-3 py-1.5 font-medium text-xs rounded-lg font-[\'Cairo\'] ' + getStatusClass(exam)">
                        {{ getStatusText(exam) }}
                    </span>
                </td>
                <!-- Actions -->
                <td class="px-6 py-5 whitespace-nowrap text-center">
                    <div class="flex items-center justify-center gap-3">
                        <button type="button" (click)="onViewEnrollments(exam)"
                            class="w-8 h-8 rounded-lg bg-[#EFF6FF] text-[#155DFC] hover:bg-[#155DFC] hover:text-white transition-colors flex items-center justify-center group"
                            title="عرض المسجلين" aria-label="عرض المسجلين في هذا الاختبار">
                            <img [ngSrc]="'images/icons/eye.svg'" alt="View"
                                class="w-4 h-4 object-contain filter group-hover:brightness-0 group-hover:invert"
                                width="16" height="16">
                        </button>
                        <a href="javascript:void(0)" (click)="edit.emit(exam.id)"
                            class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-500 hover:bg-emerald-500 hover:text-white transition-colors flex items-center justify-center"
                            title="تعديل الاختبار">
                            <i class="pi pi-pencil text-sm"></i>
                        </a>
                        <a href="javascript:void(0)" (click)="delete.emit(exam.id)"
                            class="w-8 h-8 rounded-lg bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition-colors flex items-center justify-center"
                            title="حذف الاختبار">
                            <i class="pi pi-trash text-sm"></i>
                        </a>
                    </div>
                </td>
            </tr>
            } @empty {
            <tr>
                <td colspan="8" class="px-6 py-10 text-center text-gray-500 font-['Cairo']">
                    لا توجد اختبارات متاحة حالياً
                </td>
            </tr>
            }
        </tbody>
    </table>
</section>
