        <!-- Services Table -->
        <div class="overflow-x-auto">
            <table class="w-full text-right border-collapse">
                <thead class="bg-[#F9FAFB] border-b border-[#F3F4F6]">
                    <tr>
                        <th class="px-6 py-4 text-sm font-semibold text-[#4A5565] font-['Cairo']">اسم الخدمة</th>
                        <th class="px-6 py-4 text-sm font-semibold text-[#4A5565] font-['Cairo']">الوصف</th>
                        <th class="px-6 py-4 text-sm font-semibold text-[#4A5565] font-['Cairo']">التصنيف</th>
                        <th class="px-6 py-4 text-sm font-semibold text-[#4A5565] font-['Cairo'] text-center">إجراءات</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-[#F9FAFB]">
                    @for (service of services(); track service.id) {
                        <tr class="hover:bg-gray-50/50 transition-colors group">
                            <td class="px-6 py-5 text-sm font-medium text-[#101828] font-['Cairo']">
                                {{ service.title }}
                            </td>
                            <td class="px-6 py-5">
                                <p class="text-sm text-[#4A5565] font-['Cairo'] line-clamp-1 max-w-[320px]">
                                    {{ service.description }}
                                </p>
                            </td>
                            <td class="px-6 py-5">
                                <span class="inline-flex items-center px-3 py-1 bg-[#FFEDD4] text-[#CA3500] rounded-full text-xs font-semibold font-['Cairo']">
                                    {{ service.features && service.features.length > 0 ? service.features[0] : 'خدمة' }}
                                </span>
                            </td>
                           
                            <td class="px-6 py-5">
                                <div class="flex items-center justify-center gap-1 opacity-60 group-hover:opacity-100 transition-opacity">
                                    <button (click)="editService(service)" class="cursor-pointer p-2 text-[#98A2B3] hover:text-[#00A63E] hover:bg-green-50 rounded-lg transition-all" title="تعديل">
                                        <i class="pi pi-pencil text-sm"></i>
                                    </button>
                                    <button (click)="deleteService(service.id)" class="cursor-pointer p-2 text-[#98A2B3] hover:text-[#E7000B] hover:bg-red-50 rounded-lg transition-all" title="حذف">
                                        <i class="pi pi-trash text-sm"></i>
                                    </button>
                                    
                                </div>
                            </td>
                        </tr>
                    } @empty {
                        <tr>
                            <td colspan="7" class="px-6 py-10 text-center text-gray-500 font-['Cairo']">
                                لا توجد خدمات متاحة حالياً.
                            </td>
                        </tr>
                    }
                </tbody>


            </table>
        </div>

    </div>
