<!-- Bottom Dashboard Grids -->
<section class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full pb-8">

  <!-- Upcoming Tests List -->
  <div class="flex flex-col bg-white border border-gray-100 rounded-2xl shadow-sm p-6 gap-4">
    <div class="flex items-center gap-2 mb-2">
      <img [ngSrc]="'images/icons/exams.svg'" alt="Calendar Icon" class="w-5 h-5 object-contain" width="20" height="20">
      <h3 class="text-gray-900 font-normal text-lg font-['Cairo'] m-0">الاختبارات القادمة</h3>
    </div>

    <!-- List Items (Upcoming Tests) -->
    <div class="flex flex-col gap-3">

      <!-- Item 1 -->
      <div
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-3 sm:px-4 bg-gray-50 rounded-xl gap-3 sm:gap-0">
        <div class="flex flex-col gap-1">
          <p class="text-gray-900 font-normal text-sm font-['Cairo'] m-0">اختبار TOEFL - دفعة يناير</p>
          <p class="text-gray-500 font-normal text-xs font-['Cairo'] m-0" dir="ltr">2025-01-15 - 09:00</p>
        </div>
        <div class="flex flex-col items-end gap-1">
          <span class="text-blue-600 font-medium text-sm font-['Cairo']" dir="ltr">35/50</span>
          <span class="text-gray-500 font-normal text-xs font-['Cairo']">مسجل</span>
        </div>
      </div>

      <!-- Item 2 -->
      <div
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-3 sm:px-4 bg-gray-50 rounded-xl gap-3 sm:gap-0">
        <div class="flex flex-col gap-1">
          <p class="text-gray-900 font-normal text-sm font-['Cairo'] m-0">اختبار IELTS - دفعة يناير</p>
          <p class="text-gray-500 font-normal text-xs font-['Cairo'] m-0" dir="ltr">2025-01-20 - 10:00</p>
        </div>
        <div class="flex flex-col items-end gap-1">
          <span class="text-blue-600 font-medium text-sm font-['Cairo']" dir="ltr">28/40</span>
          <span class="text-gray-500 font-normal text-xs font-['Cairo']">مسجل</span>
        </div>
      </div>

    </div>
  </div>
  <!-- Needs Review List -->
  <div class="flex flex-col bg-white border border-gray-100 rounded-2xl shadow-sm p-6 gap-4">
    <div class="flex items-center gap-2 mb-2">
      <img [ngSrc]="'images/icons/alert.svg'" alt="Alert Icon" class="w-5 h-5 object-contain" width="20" height="20">
      <h3 class="text-gray-900 font-normal text-lg font-['Cairo'] m-0">يحتاج مراجعة</h3>
    </div>

    <!-- List Items (Needs Review) -->
    <div class="flex flex-col gap-3">

      <!-- Item 1 -->
      <div
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-3 sm:px-4 bg-orange-50 rounded-xl gap-3 sm:gap-0">
        <div class="flex flex-col gap-1">
          <p class="text-gray-900 font-normal text-sm font-['Cairo'] m-0">اختبار TOEFL - دفعة يناير</p>
          <p class="text-gray-500 font-normal text-xs font-['Cairo'] m-0">طلبات قيد المراجعة</p>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-orange-600 font-bold text-lg font-['Cairo']">12</span>
          <button class="text-blue-600 font-normal text-xs font-['Cairo'] hover:underline">مراجعة</button>
        </div>
      </div>

      <!-- Item 2 -->
      <div
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-3 sm:px-4 bg-orange-50 rounded-xl gap-3 sm:gap-0">
        <div class="flex flex-col gap-1">
          <p class="text-gray-900 font-normal text-sm font-['Cairo'] m-0">اختبار IELTS - دفعة يناير</p>
          <p class="text-gray-500 font-normal text-xs font-['Cairo'] m-0">طلبات قيد المراجعة</p>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-orange-600 font-bold text-lg font-['Cairo']">8</span>
          <button class="text-blue-600 font-normal text-xs font-['Cairo'] hover:underline">مراجعة</button>
        </div>
      </div>

    </div>
  </div>

</section> <!-- End Bottom Dashboard -->
