<!-- Filters Section -->
<section class="flex flex-col md:flex-row p-6 gap-4 border-t border-gray-100">
    <!-- Search Input -->
    <div class="relative flex-1">
        <input type="text" placeholder="البحث باسم الاختبار..."
            class="w-full h-[46px] pr-12 pl-4 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200 font-['Cairo'] text-sm text-gray-900 placeholder-gray-400 transition-all">
        <img [ngSrc]="'images/icons/search.svg'" alt="Search Icon" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 object-contain" width="20" height="20">
    </div>
    <!-- Custom Dropdown (Placeholder for Type/Category) -->
    <div class="relative w-full md:w-[180px]">
        <select
            class="w-full h-[46px] px-4 appearance-none bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200 font-['Cairo'] text-sm text-gray-900 transition-all cursor-pointer">
            <option>جميع الأنواع</option>
            <option>TOEFL</option>
            <option>IELTS</option>
            <option>General</option>
        </select>
        <img [ngSrc]="'images/icons/arrow.svg'" alt="Dropdown Icon"
            class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 object-contain pointer-events-none rotate-90" width="16" height="16">
    </div>
</section>
