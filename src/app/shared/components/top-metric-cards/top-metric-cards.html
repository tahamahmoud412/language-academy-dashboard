<!-- Top Metric Cards Grid (Responsive Grid) -->
<section class=" grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

  <!-- Card 1: Total Students -->
  <div class="flex flex-col p-6 gap-4 bg-white border border-gray-100 rounded-2xl shadow-sm">
    <div class="flex justify-between items-center w-full">
      <div class="flex justify-center items-center w-12 h-12 bg-blue-50 rounded-xl">
        <img [ngSrc]="'images/icons/students.svg'" alt="Students Icon" class="w-10 h-10 object-contain" width="40" height="40" priority>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <p class="text-gray-600 font-normal text-sm font-['Cairo'] m-0">إجمالي الطلاب</p>
      <p class="text-gray-900 font-normal text-2xl font-['Cairo'] m-0">{{ stats()?.total_students || 0 }}</p>
    </div>
  </div>

  <!-- Card 2: Active Tests -->
  <div class="flex flex-col p-6 gap-4 bg-white border border-gray-100 rounded-2xl shadow-sm">
    <div class="flex justify-between items-center w-full">
      <div class="flex justify-center items-center w-12 h-12 bg-green-50 rounded-xl">
        <img [ngSrc]="'images/icons/exams.svg'" alt="Tests Icon" class="w-6 h-6 object-contain" width="24" height="24" priority>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <p class="text-gray-600 font-normal text-sm font-['Cairo'] m-0">الاختبارات القادمة</p>
      <p class="text-gray-900 font-normal text-2xl font-['Cairo'] m-0">{{ stats()?.upcoming_exams || 0 }}</p>
    </div>
  </div>

  <!-- Card 3: Active Courses -->
  <div class="flex flex-col p-6 gap-4 bg-white border border-gray-100 rounded-2xl shadow-sm">
    <div class="flex justify-between items-center w-full">
      <div class="flex justify-center items-center w-12 h-12 bg-green-50 rounded-xl">
        <img [ngSrc]="'images/icons/courses.svg'" alt="Courses Icon" class="w-6 h-6 object-contain" width="24" height="24" priority>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <p class="text-gray-600 font-normal text-sm font-['Cairo'] m-0">الكورسات النشطة</p>
      <p class="text-gray-900 font-normal text-2xl font-['Cairo'] m-0">{{ stats()?.active_courses || 0 }}</p>
    </div>
  </div>

  <!-- Card 4: Service Requests -->
  <div class="flex flex-col p-6 gap-4 bg-white border border-gray-100 rounded-2xl shadow-sm">
    <div class="flex justify-between items-center w-full">
      <div class="flex justify-center items-center w-12 h-12 bg-orange-50 rounded-xl">
        <img [ngSrc]="'images/icons/services.svg'" alt="Requests Icon" class="w-6 h-6 object-contain" width="24" height="24" priority>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <p class="text-gray-600 font-normal text-sm font-['Cairo'] m-0">الخدمات الجديدة</p>
      <p class="text-gray-900 font-normal text-2xl font-['Cairo'] m-0">{{ stats()?.new_services || 0 }}</p>
    </div>
  </div>

</section> <!-- End Metric Cards -->
