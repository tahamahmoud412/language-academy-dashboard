<div class="flex flex-col w-full min-h-screen p-4 md:p-8 space-y-6 bg-[#F9FAFB]" dir="rtl">
    <!-- Header Section -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-blue-100 rounded-xl">
                <i class="pi pi-calendar text-[#155DFC] text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-[#101828] font-['Cairo']">الأحداث الزمنية (Timeline)</h1>
                <p class="text-sm text-[#6A7282] font-['Cairo']">اجمالي الأحداث ({{ totalEvents() }} حدث)</p>
            </div>
        </div>

        <button
            (click)="openAddEvent()"
            class="bg-[#FF6900] text-white px-6 py-2.5 rounded-xl flex items-center gap-2 hover:bg-[#e55e00] transition-all font-['Cairo'] shadow-[0px_1px_3px_rgba(0,0,0,0.1)] active:scale-95">
            <i class="pi pi-plus text-xs"></i>
            <span>إضافة حدث جديد</span>
        </button>
    </div>

    <!-- Events Table -->
    <div class="bg-white border border-[#F3F4F6] rounded-2xl shadow-[0px_1px_3px_rgba(0,0,0,0.1)] flex flex-col overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-right border-collapse">
                <thead class="bg-[#F9FAFB] border-b border-[#F3F4F6]">
                    <tr>
                        <th class="px-6 py-4 text-sm font-semibold text-[#4A5565] font-['Cairo'] w-[25%]">عنوان الحدث</th>
                        <th class="px-6 py-4 text-sm font-semibold text-[#4A5565] font-['Cairo'] w-[40%]">الوصف</th>
                        <th class="px-6 py-4 text-sm font-semibold text-[#4A5565] font-['Cairo']">السنة</th>
                        <th class="px-6 py-4 text-sm font-semibold text-[#4A5565] font-['Cairo'] text-center">إجراءات</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-[#F9FAFB]">
                    @for (event of events(); track event.id) {
                        <tr class="hover:bg-gray-50/50 transition-colors group">
                            <td class="px-6 py-5 text-sm font-medium text-[#101828] font-['Cairo']">
                                {{ event.title }}
                            </td>
                            <td class="px-6 py-5">
                                <p class="text-sm text-[#4A5565] font-['Cairo'] line-clamp-1">
                                    {{ event.description }}
                                </p>
                            </td>
                            <td class="px-6 py-5 text-sm text-[#4A5565] font-['Cairo']">
                                {{ event.year }}
                            </td>
                            <td class="px-6 py-5">
                                <div class="flex items-center justify-center gap-1 opacity-60 group-hover:opacity-100 transition-opacity">
                                    <button (click)="openEditEvent(event)" class="cursor-pointer p-2 text-[#98A2B3] hover:text-[#155DFC] hover:bg-blue-50 rounded-lg transition-all" title="تعديل">
                                        <i class="pi pi-pencil text-sm"></i>
                                    </button>
                                    <button (click)="deleteEvent(event.id)" class="cursor-pointer p-2 text-[#98A2B3] hover:text-[#E7000B] hover:bg-red-50 rounded-lg transition-all" title="حذف">
                                        <i class="pi pi-trash text-sm"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    } @empty {
                        <tr>
                            <td colspan="5" class="px-6 py-10 text-center text-gray-500 font-['Cairo']">
                                لا توجد أحداث متاحة حالياً.
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>

@if (isAddEventVisible()) {
    <app-event-add [eventToEdit]="selectedEvent()" (onClose)="closeAddEvent()" (onEventSaved)="handleEventSaved()"></app-event-add>
}
