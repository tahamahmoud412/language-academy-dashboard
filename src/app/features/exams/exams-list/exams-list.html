<div class="flex flex-col w-full min-h-screen p-4 md:p-8 space-y-6" dir="rtl">
    <!-- Exams Main Container -->
    <div class="flex flex-col bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden min-h-[533px]">
        
        @if (loading()) {
            <div class="flex justify-center items-center py-20 font-['Cairo']">
                <span>جاري التحميل...</span>
            </div>
        } @else {
            <!-- Exams Header -->
            <app-exams-header [stats]="stats()" [totalExams]="pagination()?.total || 0" (onAddExam)="openAddExam()"></app-exams-header>

            <!-- Filters Section -->
            <app-exams-filter></app-exams-filter>

            <!-- Table Container -->
            <app-exams-table [exams]="examsList()"></app-exams-table>

            <!-- Pagination -->
            @if (pagination()) {
                <div class="flex flex-col md:flex-row justify-between items-center p-6 border-t border-gray-100 gap-4">
                    <span class="text-sm text-gray-500 font-['Cairo']">
                        عرض {{ pagination()!.from }} إلى {{ pagination()!.to }} من {{ pagination()!.total }} اختبار
                    </span>
                    <div class="flex items-center gap-2">
                        <button [disabled]="currentPage() === 1" (click)="onPageChange(currentPage() - 1)"
                            class="px-4 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 font-medium font-['Cairo'] hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            السابق
                        </button>
                        
                        <span class="text-sm text-gray-600 font-['Cairo']">
                            صفحة {{ currentPage() }} من {{ pagination()!.last_page }}
                        </span>

                        <button [disabled]="currentPage() === pagination()!.last_page" (click)="onPageChange(currentPage() + 1)"
                            class="px-4 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 font-medium font-['Cairo'] hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            التالي
                        </button>
                    </div>
                </div>
            }
        }
       
    </div>

    <!-- Modal for adding exams could be added here in the future -->
</div>
