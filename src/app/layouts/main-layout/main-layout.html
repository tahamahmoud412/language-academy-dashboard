<div class="flex flex-col lg:flex-row h-screen overflow-hidden bg-gray-50 bg-opacity-50" dir="rtl">
  
  <!-- Mobile Navbar (lg:hidden) -->
  <header class="lg:hidden flex items-center justify-between px-6 py-4 bg-white border-b border-slate-100 shadow-sm z-40">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-md shadow-blue-50">
        <span class="text-white font-bold text-xl font-['Cairo']">L</span>
      </div>
      <h1 class="text-lg font-bold text-slate-800 font-['Cairo']">لوحة التحكم</h1>
    </div>
    <button (click)="toggleSidebar()" class="p-2 text-slate-500 hover:bg-slate-50 rounded-xl transition-colors">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </header>

  <!-- Sidebar Overlay (Mobile Only) -->
  @if (isSidebarOpen()) {
    <div (click)="closeSidebar()" 
         class="lg:hidden fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] z-40 transition-all duration-300 animate-in fade-in"></div>
  }

  <!-- Sidebar on the right -->
  <app-side-bar [isOpen]="isSidebarOpen()" 
                (close)="closeSidebar()"
                class="fixed lg:relative h-full z-50 lg:z-auto transition-transform duration-300 lg:translate-x-0"
                [class.translate-x-full]="!isSidebarOpen()"
                [class.translate-x-0]="isSidebarOpen()"></app-side-bar>

  <!-- Main content area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <main class="flex-1">
      <app-top-metric-cards 
        [totalStudents]="stats()?.total_students ?? 0"
        [activeCourses]="stats()?.active_courses ?? 0"
        [upcomingExams]="stats()?.upcoming_exams ?? 0"
        [newServices]="stats()?.new_services ?? 0">
      </app-top-metric-cards>
      <router-outlet></router-outlet>
    </main>

    <footer>
      <!-- Global App Footer -->
    </footer>
  </div>
</div>
